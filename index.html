<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A8E6CF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kanopi">
  <title>Kanopi</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icons/icon-192-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-dark.png">
  <style>
/* Kanopi: Mint design system v0.4 (D12, D26, provisional).
   Desktop first (1440 design width), responsive down to mobile.
   Mobile layout under 768px; desktop layout at 768px and wider.
   Mint is for surfaces and accents. Text is dark green or near-black.
   --mint-strong is a deeper mint for meter fills so they reach 3:1 against the track. */

:root {
  --mint: #A8E6CF;
  --mint-soft: #E6F7EF;
  --mint-strong: #2E9E76;
  --leaf: #2E9E76;
  --leaf-deep: #1F7A5A;
  --bark: #7A5A3C;
  --ink: #0E3B2B;
  --muted: #3D5A4E;
  --bg: #F5FBF8;
  --card: #FFFFFF;
  --border: #CFE6DA;
  --radius: 6px;
  --touch: 44px;
  --sidebar: 240px;
}

/* Fonts are self-hosted in /fonts (Latin subset, WOFF2) so the app works offline and makes no calls to Google.
   Licenses: fonts/OFL-Mouse-Memoirs.txt and fonts/OFL-Noto-Sans.txt. */
@font-face {
  font-family: "Mouse Memoirs";
  src: url("fonts/mouse-memoirs-v19-latin-regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Noto Sans";
  src: url("fonts/noto-sans-v42-latin-regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Noto Sans";
  src: url("fonts/noto-sans-v42-latin-600.woff2") format("woff2");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Noto Sans";
  src: url("fonts/noto-sans-v42-latin-700.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --font-title: "Mouse Memoirs", "Marker Felt", "Chalkboard SE", system-ui, sans-serif;
  --font-body: "Noto Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background: var(--bg);
  min-height: calc(var(--touch) + 8px);
}

.topbar h1 {
  margin: 0;
  font-family: var(--font-title);
  font-size: 40px;
  font-weight: 400;
  line-height: 1.05;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--touch);
  height: var(--touch);
  border-radius: 50%;
  color: var(--ink);
  text-decoration: none;
}

.icon-btn:focus-visible,
.nav a:focus-visible {
  outline: 3px solid var(--mint-strong);
  outline-offset: 2px;
}

/* Banner */
.banner {
  margin: 4px 16px 0;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--mint-soft);
  font-size: 13px;
  color: var(--ink);
}

/* Main content */
main {
  padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
  max-width: 520px;
  margin: 0 auto;
  outline: none;
}

.stack { display: grid; gap: 12px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.card-label {
  margin: 0 0 6px;
  font-family: var(--font-title);
  font-size: 27px;
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
}

.big {
  margin: 0;
  font-size: 32px;
  font-weight: 700;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 8px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}

.muted {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--muted);
}

/* Meter */
.meter {
  height: 8px;
  border-radius: 4px;
  background: var(--mint-soft);
  border: 1px solid var(--border);
  overflow: hidden;
}

.meter > span {
  display: block;
  height: 100%;
  background: var(--mint-strong);
}

/* Signal list */
.signal-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.signal-list a {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--touch);
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
}

.pill {
  flex: none;
  padding: 2px 10px;
  border: 1px solid var(--ink);
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
}

/* Placeholder screens */
.empty h2 {
  margin: 0 0 6px;
  font-size: 18px;
}

.empty p {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}

/* Navigation: bottom tab bar on mobile (Settings is the gear in the top bar) */
.brand,
.nav a.desktop-only { display: none; }

.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--border);
}

.nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: var(--touch);
  border-radius: 999px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.nav a.active {
  background: var(--mint);
  color: var(--ink);
}

@media (prefers-reduced-motion: no-preference) {
  .meter > span { transition: width 300ms ease-out; }
}

/* Desktop: left sidebar, wider content, card grid */
@media (min-width: 768px) {
  body {
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
  }

  .nav {
    position: sticky;
    top: 0;
    left: auto;
    right: auto;
    bottom: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 24px 16px;
    border-top: 0;
    border-right: 1px solid var(--border);
  }

  .brand {
    display: block;
    padding: 0 12px 16px;
    font-family: var(--font-title);
    font-size: 38px;
    font-weight: 400;
    line-height: 1.05;
  }

  .nav a {
    justify-content: flex-start;
    padding: 0 12px;
    border-radius: var(--radius);
    font-size: 15px;
  }

  .nav a:hover:not(.active) { background: var(--mint-soft); }

  .nav a.desktop-only {
    display: flex;
    margin-top: auto;
  }

  .icon-btn { display: none; }

  .topbar { padding: 24px 32px 8px; }

  .banner {
    margin: 4px 32px 0;
    max-width: 1036px;
  }

  main {
    max-width: 1100px;
    margin: 0;
    padding: 16px 32px 48px;
  }

  .stack {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .card.wide { grid-column: 1 / -1; }
}

@media (min-width: 1200px) {
  .stack { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card.wide-lg { grid-column: 1 / -1; }
}

/* Tappable card (Home -> detail page) */
.card-link {
  display: block;
  color: inherit;
  text-decoration: none;
}

.card-link:hover { border-color: var(--mint-strong); }

.card-link:focus-visible {
  outline: 3px solid var(--mint-strong);
  outline-offset: 2px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 24px;
}

.chev {
  font-size: 24px;
  line-height: 1;
  color: var(--muted);
}

/* Detail pages */
.detail {
  display: grid;
  gap: 12px;
  max-width: 720px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  min-height: var(--touch);
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}

.back-link:focus-visible {
  outline: 3px solid var(--mint-strong);
  outline-offset: 2px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.section-head .card-label { margin: 0; }

.section-total {
  font-size: 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  border-top: 1px solid var(--border);
}

.pay-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.pay-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--touch);
  padding: 8px 0;
  border-top: 1px solid var(--border);
}

.pay-row:first-child { border-top: 0; }

.pay-row .pill { min-width: 48px; text-align: center; }

.pay-main {
  flex: 1;
  display: grid;
  gap: 2px;
}

.pay-name { font-size: 15px; font-weight: 600; }

.pay-meta { font-size: 13px; color: var(--muted); }

.pay-amt {
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ---- Kanopi tree theme (subtle) ---- */

/* Logo mark */
.mark { width: 28px; height: 28px; flex: none; }

.brand {
  align-items: center;
  gap: 8px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

@media (min-width: 768px) {
  .brand { display: flex; }
  .mark-mobile { display: none; }
}

/* Leaf accent before card titles */
.card-label::before {
  content: "";
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 6px;
  vertical-align: -1px;
  background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%232E9E76'%20d='M20.89%202.3C20.46%202.22%2010.42.55%205.07%205.9c-.71.71-1.33%201.54-1.85%202.47C1.23%2011.94%201.71%2016.06%204.4%2019c1.78-4.44%205.26-8.02%209.6-10c-3.86%202.73-6.71%207.2-7.21%2011.89c1.32.73%202.78%201.11%204.26%201.11s3.11-.4%204.58-1.22c.93-.52%201.76-1.14%202.47-1.85c5.35-5.35%203.67-15.39%203.6-15.82a.99.99%200%200%200-.81-.81'/%3E%3C/svg%3E") center / contain no-repeat;
}

/* Leaf-shaped tags */
.pill { border-radius: 14px 2px 14px 2px; }

/* Leaf meter */
.leaves {
  display: flex;
  gap: 4px;
}

.leaf {
  flex: 1 1 0;
  min-width: 0;
  max-width: 30px;
  height: auto;
  aspect-ratio: 1;
}

.leaf.on { fill: var(--leaf); stroke: var(--leaf-deep); stroke-width: 1; stroke-linejoin: round; }
.leaf.off { fill: none; stroke: #5C9A7E; stroke-width: 1.5; stroke-linejoin: round; }

/* Net worth tree */
.nw-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.tree {
  width: 104px;
  height: 104px;
  flex: none;
}

@media (min-width: 768px) {
  .tree { width: 120px; height: 120px; }
}

/* Tree-ring divider */
.divider span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.rings {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: var(--bark);
  stroke-width: 1.4;
}

/* ---- Family switcher ---- */
.switcher {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 12px;
}

.seg {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: var(--touch);
  padding: 4px 14px 4px 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.seg:hover { border-color: var(--mint-strong); }

.seg[aria-pressed="true"] {
  background: var(--mint);
  border-color: var(--ink);
}

.seg:focus-visible {
  outline: 3px solid var(--mint-strong);
  outline-offset: 2px;
}

.avatar {
  display: inline-flex;
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: 50%;
  overflow: hidden;
  background: var(--mint-soft);
}

.avatar svg {
  width: 100%;
  height: 100%;
  display: block;
}

.scope-note { margin: 0 0 12px; }

/* ---- Charts, tables and sub-pages ---- */
:root {
  --axis: #B9D3C6;
  --gray-mark: #7D8B84;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Section links inside a module (Portfolio, Budget) */
.subnav {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 0 0 12px;
  border-bottom: 1px solid var(--border);
}

.subnav a {
  display: inline-flex;
  align-items: center;
  min-height: var(--touch);
  padding: 0 2px;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}

.subnav a[aria-current="page"] {
  color: var(--ink);
  border-bottom-color: var(--leaf);
}

.subnav a:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

.seg.plain { padding: 4px 14px; }

.switcher + .bars,
.switcher + .cols { margin-top: 4px; }

/* Horizontal bars */
.bars {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  display: grid;
  gap: 12px;
}

.bar-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
  font-size: 14px;
}

.bar-name { color: var(--ink); font-weight: 600; }

.bar-text {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.bar-track {
  height: 14px;
  border-left: 1px solid var(--axis);
}

.bars-meter .bar-track {
  background: var(--mint-soft);
  border-radius: 0 4px 4px 0;
}

.bar-fill {
  display: block;
  height: 100%;
  min-width: 2px;
  background: var(--leaf);
  border-radius: 0 4px 4px 0;
}

.bar-fill.muted { background: var(--gray-mark); }
.bar-fill.over { background: var(--bark); }
.bar-fill.zero { display: none; }

.bar-item:hover .bar-fill { filter: brightness(0.9); }

/* Columns */
.cols {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 12px;
  min-height: 190px;
  padding: 8px 0 0;
  border-bottom: 1px solid var(--axis);
}

.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  flex: 1;
}

.col-val {
  font-size: 13px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.col-bar {
  display: block;
  width: 24px;
  background: var(--leaf);
  border-radius: 4px 4px 0 0;
}

.col:hover .col-bar { filter: brightness(0.9); }

.col-label {
  margin-top: 4px;
  padding-top: 6px;
  font-size: 13px;
  color: var(--muted);
}

.cols + .muted { margin-top: 24px; }

/* Tables */
.tbl-wrap { overflow-x: auto; margin: 4px 0 0; }

.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.tbl th,
.tbl td {
  padding: 10px 12px 10px 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

.tbl th {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.tbl td.num,
.tbl th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  padding-right: 0;
  padding-left: 12px;
}

.tbl tr.strong td { font-weight: 700; }

.cell-sub {
  display: block;
  font-size: 13px;
  color: var(--muted);
  white-space: normal;
}

.sum-row { margin: 10px 0 0; font-weight: 600; }

.sub-label {
  margin: 12px 0 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.sub-label:first-child { margin-top: 0; }

.plain-list {
  list-style: none;
  margin: 0 0 8px;
  padding: 0;
  display: grid;
  gap: 8px;
  font-size: 14px;
}

.plain-list > li:not(.member-row) {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.member-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--touch);
}

.text-link {
  color: var(--ink);
  font-weight: 600;
}

.text-link:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

/* Buttons (disabled until the feature exists) */
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

.btn {
  min-height: var(--touch);
  padding: 0 16px;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
}

.btn:disabled {
  border-color: var(--border);
  color: var(--muted);
  cursor: not-allowed;
}

/* A left-aligned column that follows a number column needs air */
.tbl td.num + td,
.tbl th.num + th:not(.num) { padding-left: 20px; }

/* Keep the three switcher buttons on one row on phones */
@media (max-width: 479px) {
  .switcher { gap: 6px; }
  .seg { gap: 6px; padding-right: 10px; font-size: 14px; }
  .seg.plain { padding: 4px 12px; }
  .avatar { width: 32px; height: 32px; }
}

@media (max-width: 479px) {
  .subnav { gap: 0 12px; }
  .subnav a { font-size: 14px; }
}

body { line-height: 1.4; }

@media (max-width: 479px) {
  .subnav { flex-wrap: nowrap; overflow-x: auto; gap: 0 8px; }
  .subnav a { white-space: nowrap; }
}

/* Phones: tables marked tbl-keep keep their table layout, scroll sideways, and pin the first column */
@media (max-width: 599px) {
  .stack:has(> .card .tbl-keep) { grid-template-columns: minmax(0, 1fr); }
  .tbl-wrap.tbl-keep { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; min-width: 0; width: 100%; }
  .tbl-wrap.tbl-keep .tbl { display: table; }
  .tbl-wrap.tbl-keep .tbl thead { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
  .tbl-wrap.tbl-keep .tbl tbody { display: table-row-group; }
  .tbl-wrap.tbl-keep .tbl tr { display: table-row; padding: 0; border-bottom: 0; }
  .tbl-wrap.tbl-keep .tbl td,
  .tbl-wrap.tbl-keep .tbl th { display: table-cell; padding: 10px 12px 10px 0; gap: 0; border-bottom: 1px solid var(--border); text-align: left; }
  .tbl-wrap.tbl-keep .tbl td.num,
  .tbl-wrap.tbl-keep .tbl th.num,
  .tbl-wrap.tbl-keep .tbl td.num + td { text-align: right; padding-left: 20px; }
  .tbl-wrap.tbl-keep .tbl td::before { content: none; }
  .tbl-wrap.tbl-keep .tbl td:first-child { display: table-cell; font-weight: normal; padding-bottom: 10px; }
  .tbl-wrap.tbl-keep .tbl th:first-child,
  .tbl-wrap.tbl-keep .tbl td:first-child {
    position: sticky; left: 0; z-index: 1; background: var(--card);
    box-shadow: 8px 0 8px -8px rgba(14, 59, 43, .18);
  }
  .tbl-wrap.tbl-keep .tbl th:first-child { z-index: 2; }
  .tbl-wrap.tbl-keep .tbl td .cell-sub { display: block; margin-left: 0; }
}

/* Phones: each table row becomes a small stacked block, so nothing scrolls sideways */
@media (max-width: 599px) {
  .tbl-wrap { overflow-x: visible; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl thead {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .tbl tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tbl td,
  .tbl td.num,
  .tbl td.num + td {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; padding: 3px 0; border: 0; text-align: right;
    white-space: normal; font-variant-numeric: tabular-nums;
  }
  .tbl td::before {
    content: attr(data-label); flex: none; text-align: left;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  /* First cell is the row's title */
  .tbl td:first-child {
    display: block; text-align: left; font-weight: 700; padding-bottom: 4px;
  }
  .tbl td:first-child::before { content: none; }
  /* Planner rows: the icon buttons sit on the same line as the row title */
  .tbl tr.has-act { position: relative; }
  .tbl tr.has-act > td.act-cell { display: block; position: absolute; top: 4px; right: 0; padding: 0; border: 0; }
  .tbl tr.has-act > td.act-cell::before { content: none; }
  .tbl td:empty::before { content: none; }
  .tbl tr.has-act > td:first-child { padding-right: 96px; }
  .tbl td .cell-sub { display: inline; margin-left: 6px; }
}

/* ---- Phones: member switcher moves to the top bar ---- */
.topbar-right { display: flex; align-items: center; gap: 4px; }
.who-menu { position: relative; display: none; }

@media (max-width: 767px) {
  .who-menu { display: block; }
  .who-switcher { display: none; }
}

.who-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: var(--touch);
  padding: 4px 8px 4px 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}

.who-btn[aria-expanded="true"] { background: var(--mint); border-color: var(--ink); }

.who-btn:focus-visible,
.who-item:focus-visible {
  outline: 3px solid var(--mint-strong);
  outline-offset: 2px;
}

.who-chev, .who-check {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.who-list {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 30;
  min-width: 190px;
  margin: 0;
  padding: 6px;
  list-style: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(14, 59, 43, 0.14);
}

.who-list[hidden] { display: none; }

.who-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--touch);
  padding: 4px 10px 4px 4px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}

.who-item:hover { background: var(--mint-soft); }
.who-item[aria-checked="true"] { background: var(--mint); }
.who-item > span:not(.avatar) { flex: 1; }
.who-item .who-check { visibility: hidden; }
.who-item[aria-checked="true"] .who-check { visibility: visible; }

/* ---- Family editing ---- */
.avatar { box-shadow: 0 0 0 2px var(--ring, transparent); }
.avatar-together, .pick .avatar { box-shadow: none; }

.member-row { flex-wrap: wrap; }
.member-row .pay-main { flex: 1; min-width: 120px; }
.member-actions { display: flex; gap: 8px; margin-left: auto; flex: none; }
.member-edit { display: block; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }

@media (max-width: 479px) {
  .member-actions { width: 100%; }
  .member-actions .btn { flex: 1; }
}

.member-form .field { margin: 0 0 16px; }
.field label, .field-label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }

.field input[type="text"] {
  width: 100%;
  min-height: var(--touch);
  padding: 0 12px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
}

.field input[aria-invalid="true"] { border-color: var(--bark); border-width: 2px; }
.field input:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
.form-error { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--ink); }

.pick-row { display: flex; flex-wrap: wrap; gap: 6px; }

.pick, .swatch {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--touch);
  height: var(--touch);
  padding: 0;
  border: 2px solid transparent;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.pick[aria-pressed="true"], .swatch[aria-pressed="true"] { border-color: var(--ink); background: var(--mint); }
.pick:hover, .swatch:hover { border-color: var(--mint-strong); }
.pick[aria-pressed="true"]:hover, .swatch[aria-pressed="true"]:hover { border-color: var(--ink); }
.pick:focus-visible, .swatch:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

.swatch > span { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; }
.swatch svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.swatch[aria-pressed="true"] svg { visibility: visible; }

.btn-primary { background: var(--ink); color: #fff; }
.btn-danger { background: var(--bark); border-color: var(--bark); color: #fff; }
.btn:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

input, button { font-family: inherit; }

/* ---- Data panels ---- */
.data-panel { margin: 8px 0 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
.data-panel .plain-list li { display: flex; justify-content: space-between; gap: 12px; }
.field input[type="file"] { width: 100%; font: inherit; font-size: 14px; color: var(--ink); }
.field input[type="password"] {
  width: 100%; min-height: var(--touch); padding: 0 12px; border: 1px solid var(--muted);
  border-radius: var(--radius); background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
}
.field input[type="password"]:focus-visible, .field input[type="file"]:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
  
/* ---- Over budget ---- */
.leaf.poop { fill: var(--bark); stroke: none; }
.over-note { margin: 6px 0 12px; font-size: 14px; font-weight: 700; color: var(--bark); }

/* ---- Pie chart ---- */
.pie-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
.pie { flex: 0 0 auto; width: 200px; height: 200px; }
.pie path, .pie circle { stroke: var(--card); stroke-width: 2; stroke-linejoin: round; }
.pie path:hover, .pie circle:hover { filter: brightness(0.92); }
.pie-legend { flex: 1 1 220px; min-width: 0; margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.pie-item { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.pie-swatch { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 3px; }
.pie-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.pie-val { flex: 0 0 auto; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 479px) {
  .pie-wrap { justify-content: center; }
  .pie { width: 180px; height: 180px; }
  .pie-legend { flex-basis: 100%; }
}

/* ---- Budget tools ---- */
.tool-row { margin: 0 0 12px; }
.tool-note { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--leaf-deep); }
.goal-groups { display: grid; gap: 16px; margin: 0 0 16px; }
@media (min-width: 768px) { .goal-groups { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
.goal-group { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.goal-group legend { padding: 0 6px; font-size: 14px; font-weight: 700; color: var(--ink); }
.goal-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
.goal-row label { font-size: 14px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.money-input { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; }
.goal-row .money-input { flex: 0 0 120px; }
.money-input input, .field input[type="date"], .field select, .rule-row select {
  min-height: var(--touch);
  padding: 0 10px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
}
.money-input input { width: 100%; min-width: 0; }
.field input[type="date"], .field select { width: 100%; }
.field-row { display: grid; gap: 0 12px; }
@media (min-width: 600px) { .field-row { grid-template-columns: 1fr 1fr; } }
.money-input input:focus-visible, .field input[type="date"]:focus-visible, .field select:focus-visible, .rule-row select:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
.tx-hint { margin: 4px 0 0; min-height: 1.2em; }
.check { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; min-height: var(--touch); font-size: 15px; color: var(--ink); }
.check input { width: 22px; height: 22px; accent-color: var(--leaf-deep); }
.cat-field { flex: 1; min-width: 160px; margin: 0; }
.cat-row { align-items: flex-end; }
.rule-row { align-items: center; gap: 8px; }
.rule-row select { flex: 0 1 200px; min-width: 0; }
@media (max-width: 599px) { .rule-row select { flex-basis: 100%; } }

/* ---- Transactions filters ---- */
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; margin: 0 0 8px; }
.filters .field { margin: 0 0 12px; min-width: 0; }
.filters .filter-q { grid-column: 1 / -1; }
.filters .filter-clear { display: flex; align-items: flex-end; }
.filters .filter-clear .btn { width: 100%; }
.filters .field input[type="text"] { width: 100%; }
@media (min-width: 768px) {
  .filters { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .filters .filter-q { grid-column: auto; }
  .filters .filter-clear .btn { width: auto; }
}
.tx-summary { margin: 4px 0 12px; }

/* ---- Planner ---- */
@media (max-width: 599px) { .tbl td:empty { display: none; } }
.plan-chart .row { margin: 12px 0 6px; }
.stack-bar { display: flex; gap: 2px; height: 22px; min-width: 4px; }
.bar-seg { display: block; min-width: 3px; border-radius: 2px; }
.bar-seg:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.bar-seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.bar-seg:hover { filter: brightness(0.92); }
.plan-left { margin: 14px 0 12px; font-size: 16px; }
.plan-legend { margin-top: 8px; }
.pie-sub { color: var(--muted); font-size: 13px; }
.plan-key { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }
.pie-swatch-light { background: repeating-linear-gradient(45deg, #cfe9dd 0 4px, #e8f5ee 4px 8px); border: 1px solid var(--border); }
.pill-off { color: var(--muted); border-color: var(--border); }
@media (min-width: 768px) { .plan-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; } }
.row-actions { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row-actions .btn { min-height: 36px; padding: 0 12px; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--leaf-deep); text-decoration: underline; cursor: pointer; text-align: left; }
.link-btn:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

/* ---- App banners (top of the window) ---- */
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--bg); z-index: 40; }
.app-banners { padding-top: env(safe-area-inset-top); }
.app-banners .banner {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px;
  margin: 0; max-width: none; padding: 8px 16px; border-radius: 0; text-align: center;
  background: var(--mint-soft); border-bottom: 1px solid var(--border); font-size: 13px;
}
.app-banners .banner[hidden] { display: none; }
.app-banners .banner-update { background: var(--mint); border-bottom-color: var(--mint-strong); font-weight: 600; }
.banner-btn {
  min-height: 32px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 999px;
  background: var(--ink); color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
}
.banner-close { min-width: 32px; min-height: 32px; border: 0; background: none; color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; border-radius: 50%; }
.banner-btn:focus-visible, .banner-close:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.topbar { top: env(safe-area-inset-top); padding-top: 8px; }
@media (min-width: 768px) {
  .app-banners { grid-column: 1 / -1; }
  .topbar { padding-top: 24px; }
  .nav { height: 100vh; }
}

/* ---- Menu icons ---- */
.nav-ico { flex: 0 0 auto; width: 22px; height: 22px; }
@media (max-width: 767px) {
  .nav a { flex-direction: column; gap: 2px; padding: 4px 2px; font-size: 12px; border-radius: 16px; }
  .nav a .nav-ico { width: 24px; height: 24px; }
}
@media (min-width: 768px) { .nav a { gap: 12px; } }

/* ---- Sheets sync button ---- */
.icon-btn { background: none; border: 0; cursor: pointer; font: inherit; }
.icon-btn svg { width: 22px; height: 22px; }
.nav .nav-sync { display: none; }
.how-to { margin-top: 12px; }
.sheets-form { margin-top: 16px; }
.how-to summary { cursor: pointer; font-weight: 600; min-height: var(--touch); display: flex; align-items: center; }
.how-to ol, .how-to ul { padding-left: 20px; margin: 4px 0 8px; }
@keyframes kspin { to { transform: rotate(360deg); } }
[data-sync-sheets][aria-busy="true"] svg { animation: kspin 1s linear infinite; }
@media (prefers-reduced-motion: reduce) { [data-sync-sheets][aria-busy="true"] svg { animation: none; } }
@media (min-width: 768px) {
  .nav .nav-sync {
    display: flex; align-items: center; gap: 12px; margin-top: auto; min-height: var(--touch); padding: 6px 12px;
    border: 0; border-radius: var(--radius); background: none; color: var(--muted); font: inherit; font-size: 15px;
    font-weight: 600; text-align: left; cursor: pointer;
  }
  .nav .nav-sync:hover:not(:disabled) { background: var(--mint-soft); }
  .nav .nav-sync:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
  .nav .nav-sync small { display: block; font-size: 12px; font-weight: 400; }
  .nav a.desktop-only { margin-top: 0; }
}

/* ---- Portfolio: holdings, lots popup, accounts ---- */
.hold-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 8px; }
.hold-controls .field { margin: 0; min-width: 180px; }
.sort-btn { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: inherit; cursor: pointer; min-height: 32px; text-align: inherit; }
.sort-btn:hover { text-decoration: underline; }
.sort-btn:focus-visible, .tick-btn:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
.tick-btn strong { font-size: 15px; }
.tbl tr.grp td { background: var(--mint-soft); }
.split { display: flex; gap: 2px; height: 12px; min-width: 96px; max-width: 160px; border-radius: 6px; overflow: hidden; }
.split > span { display: block; min-width: 3px; }
.split-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.split-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.pill-long { background: var(--mint); }
.pill-short { background: var(--card); border: 1px solid var(--border); }
.wash { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; cursor: help; vertical-align: middle; }
.lot-dialog { width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 32px); border: 1px solid var(--border); border-radius: var(--radius); padding: 0; background: var(--card); color: var(--ink); }
.lot-dialog::backdrop { background: rgba(20, 40, 32, 0.5); }
.dlg-body { padding: 20px; overflow: auto; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dlg-title { font-family: var(--font-title); font-size: 34px; font-weight: 400; line-height: 1.05; margin: 0; }
.lot-acc { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px 8px; }
.lot-acc summary { cursor: pointer; min-height: var(--touch); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; }
.lot-scroll.scroll { max-height: 660px; overflow-y: auto; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.lot-scroll.scroll:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }
/* Budget transactions: details flush left, amount large and flush right */
.tx-list { list-style: none; margin: 8px 0 0; padding: 0; }
.tx-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.tx-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tx-who { display: inline-flex; }
.tx-who .avatar { width: 32px; height: 32px; }
.avatar-pair { display: inline-flex; align-items: center; }
.avatar-pair .avatar + .avatar { margin-left: -10px; }
.tx-main { display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.tx-name { font-weight: 700; overflow-wrap: anywhere; }
.tx-meta { font-size: 13px; color: var(--muted); }
.tx-amt { font-size: 20px; font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.tx-amt.out { color: #B3261E; }
.tx-amt.in { color: var(--leaf-deep); }
.tx-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.tx-title .row-actions { display: inline-flex; gap: 6px; }
.tx-title .act-icon { width: 36px; height: 36px; }
.tx-block { display: flex; margin-top: 4px; }
.tx-sec { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.tx-row.strong { background: var(--mint-soft); padding-left: 8px; padding-right: 8px; border-radius: 8px; }
/* Settings > Design */
.ds-h { font-family: var(--font-title); font-weight: 400; font-size: 22px; margin: 20px 0 8px; color: var(--ink); }
.ds-h2 { font-weight: 700; margin: 12px 0 4px; }
.ds-title { font-family: var(--font-title); font-size: 26px; margin: 4px 0; color: var(--ink); }
.ds-body { margin: 4px 0; font-size: 16px; }
.ds-swatches { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .ds-swatches { grid-template-columns: 1fr 1fr; } }
.ds-sw { display: flex; gap: 12px; align-items: center; font-size: 14px; }
.ds-chip { display: inline-block; flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); }
.ds-chip-sm { width: 22px; height: 22px; border-radius: 50%; }
.ds-chart-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-icons { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 16px; }
.ds-icons li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
.ds-icons svg { width: 28px; height: 28px; color: var(--ink); }
.ds-avatars { display: flex; flex-wrap: wrap; gap: 16px; }
.ds-avatar { display: inline-flex; align-items: center; gap: 8px; }
/* Phones get card lists; wider screens keep the tables */
.tbl-cards { display: none; }
@media (max-width: 599px) {
  .tbl-desktop { display: none; }
  .tbl-cards { display: block; }
}

/* Icon-only action buttons (planner, categories) */
.act-icon { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; background: var(--card); color: var(--ink); cursor: pointer; }
.act-icon:hover:not(:disabled) { background: var(--mint-soft); }
.act-icon:disabled { opacity: .45; cursor: not-allowed; }
.act-icon:focus-visible { outline: 3px solid var(--mint-strong); outline-offset: 2px; }

/* Categories: name field and trash icon on one line */
.cat-head { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 0 4px; }
.cat-row { display: block; }
.cat-line { display: flex; align-items: center; gap: 8px; width: 100%; }
.cat-line input { flex: 1; min-width: 0; }
.cat-row.cat-fresh { background: var(--mint-soft); border-radius: var(--radius); }

/* Modal dialog (planner add and edit) */
dialog.modal { border: 0; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: 90vh; overflow: auto; background: var(--card); color: var(--ink); box-shadow: 0 12px 40px rgba(14, 59, 43, .25); }
dialog.modal::backdrop { background: rgba(14, 59, 43, .35); }
.modal-head { padding: 16px 16px 0; }
.modal-body { padding: 8px 16px 16px; }
</style>
</head>
<body>
